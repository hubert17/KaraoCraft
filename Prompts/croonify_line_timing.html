    <script>
        (function () {
            const version = "1794350427";
            const KEY = "croonify-assets-checked:editor";
            try {
                if (localStorage.getItem(KEY) === version) return;
            } catch (err) {
                return;   // no storage, no way to guarantee a single reload
            }

            window.addEventListener('load', async () => {
                const urls = [...new Set(performance.getEntriesByType('resource')
                    .map((entry) => entry.name)
                    .filter((url) => url.startsWith(location.origin) && /\.(js|mjs|css)(\?|$)/.test(url)))];

                const checks = await Promise.allSettled(urls.map(async (url) => {
                    // What the page just ran (cache only, no network) …
                    const used = await fetch(url, { cache: 'only-if-cached', mode: 'same-origin' }).catch(() => null);
                    // … against the server's copy. This also refreshes the cache entry.
                    const current = await fetch(url, { cache: 'no-cache' });
                    return !!used && used.ok && used.headers.get('last-modified') !== current.headers.get('last-modified');
                }));

                localStorage.setItem(KEY, version);   // before reloading: never more than once per version
                if (checks.some((check) => check.status === 'fulfilled' && check.value)) location.reload();
            });
        })();
    </script>

        /*
    #pageContainer is the right-column stack that hosts your injected page element.

    The two keys that prevent a textarea from forcing expansion when there's no slack:
    1) min-height:0 throughout the flex chain (already done)
    2) max-height:100% on #pageContainer (relative to right-panel’s available height)
  */

            flex: 1;
            display: block;
            overflow: visible;
            /* still no nested scroll at the container level */
            height: 100%;
        }

        /* Make injected page hosts flex-friendly so their internals (like textarea) can’t force growth */

                                                padding: 0 4px;

                                                /* ensure it doesn't steal clicks from the absolute controls */
                                                position: relative;
                                                z-index: 1;

                                            /* Hovering over the rest of the line highlights only the rest */
                                            :host([mode="voice"]) .line-body:hover {
                                                background: var(--surface-2);

                                            .line-annotation {

                                            :host([mode="voice"]) .line-annotation:empty:hover {
                                                background: var(--surface-2);

                                            :host([mode="voice"]) .line-frame:hover {

                                                position: absolute;
                                                left: 0px;
                                                top: 50%;
                                                transform: translateY(-50%);

                                                width: 26px;
                                                padding: 0px 0;

                                                font-size: 0.95em;
                                                border-radius: 5px;

                                                z-index: 2;
                                                pointer-events: auto;

                                                width: fit-content;

                                                /* keep above body for hit-testing */

                                                pointer-events: auto;

                    formData.append("user_data", JSON.stringify(userData));
                    if (localStorage.getItem("super_key") != undefined) formData.append("super_key", localStorage.getItem("super_key"));


                    const xhr = new XMLHttpRequest();
                    if (type == "regenerate" || type == "finalize") xhr.open('POST', "./submit_regen.php", true);
                    else if (type == "resync" || type == "full-reset") xhr.open('POST', "./submit_resync.php", true);
                    xhr.addEventListener('readystatechange', function (e) {
                        if (this.readyState === 4) {
                            if (this.status === 410) {
                                // Expired since the editor was opened — bring the page back and explain
                                if (window.currentPageName) window.loadPage(window.currentPageName);
                                showExpiredDialog(true);
                                return;
                            }
                            if (this.status !== 200) {
                                // Refused (already processing, no HD generations left, ...) or never
                                // reached the server: nothing was queued, so don't wait for a job.
                                if (window.currentPageName) window.loadPage(window.currentPageName);
                                showToast(this.status === 0
                                    ? "Couldn't reach Croonify. Check your connection and try again."
                                    : (this.responseText || "Couldn't start that. Please try again."), { type: "error", duration: 7000 });
                                return;
                            }
                            waitForTask(type);
                        }
                    });
                    xhr.send(formData);

                },
                onCancel: function () {
                    console.log("Cancelled action.");
                    // The mobile menu already moved to Resync/Generate — put it back
                    if (window.currentPageName) document.getElementById('mobileMenu').value = window.currentPageName;
                }
            });


            confirmDialog.inject(document.body);
        }
    </script>


    <script type="module">
        // Import the custom elements (if not loaded globally)
        import './pages/assignments-page-2.js';
        import './pages/timings-page.js';
        import './pages/line-timings-page.js';
        import './pages/basics-page.js';
        import './pages/loading-page.js';
        import './pages/options-page.js';
        import './pages/video-page.js';
        import './pages/remix-page.js';
        import './pages/advanced-page.js';
        import AudioProcessor from './editor/audio-processor.js';
        import './editor/video-processing.js';

        let vaProcessor;
        VideoAudioProcessor.getProcessor("fhljQ592RJQjL0rD").then(async (result) => {
            vaProcessor = result;

            // ── Step 1: If a task is already being processed, show the loading panel ──

            // ── Step 2: Download any missing local media ──
            await vaProcessor.downloadMissing();

            // ── Parody-aware stem check ──────────────────────
            // When the user has submitted a Parody Mode recording,
            // Stem 2 is replaced by the parody vocal track.  We still need
            // Stem 1 (instrumental) and Stem 3 (backing vocals) locally.
            const hasParody = window.userData?.parody === true;
            const hasAllStems = hasParody
                ? (vaProcessor.hasAudioBlob("1") && vaProcessor.hasAudioBlob("3"))
                : (vaProcessor.hasAudioBlob("1") && vaProcessor.hasAudioBlob("2") && vaProcessor.hasAudioBlob("3"));
            const hasVideo = vaProcessor.hasVideoBlob();

            // ── Step 3: If local media is not downloaded, initiate NAS→remote fetch ──
            if (!hasAllStems || !hasVideo) {
                triggerFetch();
                return;
            }

            // ── Step 4: Local media is downloaded — submit audio for remixing ──
            if (hasParody) {
                // Download the parody recording — used solo (not mixed with stems)
                // as the sync-vocal reference in timings editors.
                try {
                    const parodyResp = await fetch('./download_parody.php?id=' + uuid);
                    if (parodyResp.ok) {
                        const parodyBlob = await parodyResp.blob();
                        AudioProcessor.submitSingleAudio(parodyBlob);
                        console.log('Parody recording loaded for sync reference');
                    } else {
                        // Fallback to original stem 2+3 if parody recording unavailable
                        console.warn('Parody recording not available, falling back to Stem 2+3');
                        AudioProcessor.submitAudio(vaProcessor.getAudioBlob("2"), vaProcessor.getAudioBlob("3"));
                    }
                } catch (err) {
                    console.warn('Failed to load parody recording, falling back to Stem 2+3:', err);
                    AudioProcessor.submitAudio(vaProcessor.getAudioBlob("2"), vaProcessor.getAudioBlob("3"));
                }
            } else {
                AudioProcessor.submitAudio(vaProcessor.getAudioBlob("2"), vaProcessor.getAudioBlob("3"));
            }

            // ── Step 5: Show the selected panel (panels handle their own media-ready spinners) ──
            loadFromQuery();

            // Local copies let the editor open, but the server can no longer resync or
            // generate. Say so once per browser session rather than on every reload.
            const expiredNoticeKey = 'expired-notice-' + uuid;
            if (videoExpired && localStorage.getItem("super_key") == undefined && !sessionStorage.getItem(expiredNoticeKey)) {
                sessionStorage.setItem(expiredNoticeKey, '1');
                showExpiredDialog(true);
            }
        });

        /**
         * Trigger a NAS→remote fetch.  Queues the task on the server (which sets
         * the order status to "Fetching Data"), then shows the loading screen.
         * The loading page's built-in startLoading() loop polls state.php,
         * displays "Fetching Data" while waiting, and reloads on completion.
         */
        async function triggerFetch() {
            try {
                const resp = await fetch('./request_fetch.php?id=' + uuid);
                const data = await resp.json();

                if (data.status === 'already_available') {
                    // Remote says data is present, but some blobs may still be missing
                    // (e.g. video_only NULL while stems exist). Retry downloads directly
                    // instead of hard-reloading to avoid an infinite reload loop.
                    console.log("Remote data already available. Retrying download...");
                    retryDownloadStems(5, 2000);
                    return;
                }

                if (data.status === 'fetch_complete_retry') {
                    // Fetch already completed but files are still syncing to remote.
                    // Retry stem downloads a few times before giving up.
                    console.log("Fetch completed, files syncing — retrying download...");
                    retryDownloadStems(5, 2000);
                    return;
                }

                if (data.status === 'queued') {
                    // Server set status to "Fetching Data".
                    // Use waitForTask to show loading screen with disabled sidebar buttons.
                    console.log("Fetch queued. Showing loading screen...");
                    waitForTask("fetch");
                    return;
                }

                if (data.status === 'regenerating') {
                    // A fetch came back empty because processing never made the video: the server
                    // queued it to process again. The editor has no media yet, so it restarts after.
                    window._taskAssumed = true;
                    waitForTask("regenerate");
                    return;
                }

                if (data.status === 'failed') {
                    // Processed again and still no video: say so rather than wait forever
                    const spinner = document.getElementById('init-spinner');
                    if (spinner) {
                        spinner.id = 'init-failed';
                        spinner.style.cssText = 'display:flex; align-items:center; justify-content:center; min-height:300px; padding:0 16px; text-align:center; color:var(--text-muted);';
                        spinner.textContent = "Sorry, we couldn't make this video. Please contact support@croonify.com.";
                    }
                    return;
                }

                if (data.status === 'expired') {
                    // Fetch window closed (HTTP 410) — nothing left to load, on the server or locally.
                    const spinner = document.getElementById('init-spinner');
                    if (spinner) {
                        spinner.id = 'init-expired';
                        spinner.style.cssText = 'display:flex; align-items:center; justify-content:center; min-height:300px; color:var(--text-muted);';
                        spinner.textContent = 'Video Expired';
                    }
                    showExpiredDialog(false);
                }
            } catch (err) {
                console.error("Fetch request failed:", err);
            }
        }

        /**
         * Retry downloading stems a limited number of times with delays.
         * Used after a fetch completes but files haven't propagated yet.
         */
        async function retryDownloadStems(maxRetries, delayMs) {
            for (let attempt = 1; attempt <= maxRetries; attempt++) {
                console.log(`Retry download attempt ${attempt}/${maxRetries}...`);
                await sleep(delayMs);

                try {
                    const va = await VideoAudioProcessor.getProcessor(uuid);
                    await va.downloadMissing();

                    const hasParody = window.userData?.parody === true;
                    const hasAllStems = hasParody
                        ? (va.hasAudioBlob("1") && va.hasAudioBlob("3"))
                        : (va.hasAudioBlob("1") && va.hasAudioBlob("2") && va.hasAudioBlob("3"));
                    if (hasAllStems) {
                        console.log("Stems downloaded successfully on retry " + attempt);
                        if (hasParody) {
                            try {
                                const parodyResp = await fetch('./download_parody.php?id=' + uuid);
                                if (parodyResp.ok) {
                                    const parodyBlob = await parodyResp.blob();
                                    AudioProcessor.submitSingleAudio(parodyBlob);
                                } else {
                                    AudioProcessor.submitAudio(va.getAudioBlob("2"), va.getAudioBlob("3"));
                                }
                            } catch (e) {
                                AudioProcessor.submitAudio(va.getAudioBlob("2"), va.getAudioBlob("3"));
                            }
                        } else {
                            AudioProcessor.submitAudio(va.getAudioBlob("2"), va.getAudioBlob("3"));
                        }
                        loadFromQuery();
                        return;
                    }
                } catch (e) {
                    console.warn(`Retry ${attempt} failed:`, e);
                }
            }
            // All retries exhausted
            console.error("All download retries exhausted.");
        }



        /**
         * Enable all sidebar menu buttons and mobile select.
         * Called once the right panel first appears.
         */
        function enableMenu() {
            if (window._menuEnabled) return;
            window._menuEnabled = true;

            document.querySelectorAll('.sidebar button.menu-btn').forEach(btn => {
                btn.disabled = false;
            });
            const mobileMenu = document.getElementById('mobileMenu');
            if (mobileMenu) mobileMenu.disabled = false;

            // Apply per-button state based on current user data
            if (window.updateDisabledButtons) {
                window.updateDisabledButtons(window.userData);
            }
        }


        function setUrlParams(params) {
            const url = new URL(window.location.href);
            Object.entries(params).forEach(([key, value]) => {
                url.searchParams.set(key, value);
            });
            window.history.replaceState({}, '', url);
        }


        async function startLoading() {
            // return;

            // A NAS fetch only restores files; any other task ends with a newly generated video
            const restoringOnly = (status == "Fetching Data");

            let timer = 0;
            let finishedProcess = false;
            let success = false;
            while (!finishedProcess) {
                timer++;

                if (timer % 10 == 0) {
                    await fetch('state.php?id=' + uuid)
                        .then((response) => response.text())
                        .then((text) => {
                            console.log(text);
                            status = text;
                            if (text == "Complete") {
                                finishedProcess = true;
                                success = true;
                            } else if (text == "Failed") {
                                // Processing gave up on it; the loading view says so (pages/loading-page.js)
                                finishedProcess = true;
                            } else {
                            }
                        },
                            rejection => {
                                // A dropped request says nothing about the task — keep polling
                                console.error(rejection.message);
                            })
                        .then(await sleep(500));
                } else {

                    await sleep(500);
                }
            }

            if (success) {
                console.log("HERE 2");
                await fetch('download_userdata.php?id=' + uuid)
                    .then((response) => response.text())
                    .then((text) => {
                        const resultUserData = JSON.parse(text);
                        window.userData = resultUserData;
                        window.userData.lyricsChanged = false;
                        window.userData.timingsInvalid = false;
                        window.userData['resync-required'] = false;
                        window.userData.wordsNeedResync = false;
                        window.userData.wordTimingsChanged = false;
                        if (!restoringOnly) markVideoBaseline(window.userData);
                        // Task finished: saves are live again (the upload below must not be skipped)
                        window._editorBusy = false;

                        window.updateDisabledButtons(window.userData);
                        saveUserData(resultUserData, uuid);

                        // The page reloads from the server's copy below, so the cleared
                        // flags and new baseline need to be there first
                        const uploaded = uploadUserData();

                        VideoAudioProcessor.getProcessor(uuid).then((va) => {
                            // Wait for the real files: storing a 404 or empty reply here left a broken video
                            let videoPromise = VideoAudioProcessor.fetchMediaWhenReady('download_video.php?id=' + uuid)
                                .then(blob => { if (blob) return va.setVideo(blob); });

                            let alphaPromise = VideoAudioProcessor.fetchMediaWhenReady('download_alpha.php?id=' + uuid)
                                .then(blob => { if (blob) return va.setAlpha(blob); });

                            Promise.all([
                                videoPromise, alphaPromise, uploaded
                            ]).then(() => {
                                // window.loadPage('video-view');
                                window.location = "editor.php?id=" + uuid + "&page=video";
                            });
                        });

                    },
                        rejection => {
                            console.error(rejection.message);
                        });
            }
        }

        // Create a global cache for page elements.
        const pageCache = window.pageCache;

        function loadPage(pageName) {
            // Remove the initial loading spinner now that a real panel is appearing
            const spinner = document.getElementById('init-spinner');
            if (spinner) spinner.remove();

            status = 'Complete';
            if (status == "Archived") {
                status = "Fetching Data";
                // return;
            }


            if (status != "Complete" && status != "Failed") startLoading();

            const menuButtons = document.querySelectorAll('.menu-btn');
            menuButtons.forEach((b) => {
                b.classList.remove('selected');

            });
            menuButtons.forEach((btn) => {

                if (btn.hasAttribute('data-target') && btn.getAttribute("data-target") == pageName) {
                    btn.classList.add('selected');
                }
            });

            const container = document.getElementById('pageContainer');

            // Hide any currently visible page
            Object.values(pageCache).forEach(page => {
                // console.log(page);
                if (page.style.display != 'none') {
                    page?.onWillBeHidden();
                    page.style.display = 'none';
                }
            });

            // Navigating between pages pushes unsaved changes (there is no Ctrl-S on mobile)
            uploadUserData();
            const beforeDisplay = { stale: isVideoStale(window.userData), unsaved: hasUnsavedUserData() };
            window.currentPageName = pageName;

            console.log("PAGE: " + pageName.slice(0, -5));
            setUrlParams({ id: window.uuid, page: pageName.slice(0, -5) });
            mobileMenu.value = pageName;

            // If the page already exists in the cache, just show it.
            if (pageCache[pageName]) {
                if (pageCache[pageName].style.display != 'block') {
                    pageCache[pageName].setUserData(getUserDataForReadOnly("fhljQ592RJQjL0rD"));
                    pageCache[pageName].onWillBeDisplayed?.();
                    pageCache[pageName].style.display = 'block';
                    setTimeout(() => {
                        console.log("Called?");
                        pageCache[pageName].onDisplayed?.();
                    }, 0);

                }
            } else {
                // Otherwise, create the element, set it up, and store it in the cache.
                let newPageEl;

                // ── Parody-aware audio sources ──────────────────
                // When the user has submitted a Parody Mode recording,
                // use it as the sync-vocal reference in timings editors
                // instead of the original Stem 2 (lead vocals).
                const hasParody = window.userData?.parody === true;
                const audioUrl2 = hasParody
                    ? './download_parody.php?id=fhljQ592RJQjL0rD'
                    : './download_audio.php?id=fhljQ592RJQjL0rD&stem=2';
                const audioUrl3 = './download_audio.php?id=fhljQ592RJQjL0rD&stem=3';
                switch (pageName) {
                    case 'basics-view':
                        newPageEl = document.createElement('basics-page');
                        break;
                    case 'assignments-view':
                        newPageEl = document.createElement('assignments-page');
                        newPageEl.setAttribute('audio-src-1', audioUrl2);
                        newPageEl.setAttribute('audio-src-2', audioUrl3);
                        break;
                    case 'line-timings-view':
                        newPageEl = document.createElement('line-timings-page');
                        newPageEl.setAttribute('audio-src-1', audioUrl2);
                        newPageEl.setAttribute('audio-src-2', audioUrl3);
                        break;
                    case 'timings-view':
                        newPageEl = document.createElement('timings-page');
                        newPageEl.setAttribute('audio-src-1', audioUrl2);
                        newPageEl.setAttribute('audio-src-2', audioUrl3);
                        break;
                    case 'options-view':
                        newPageEl = document.createElement('options-page');
                        break;
                    case 'loading-view':
                        newPageEl = document.createElement('loading-page');
                        break;
                    case 'video-view':
                        newPageEl = document.createElement('video-page');
                        break;
                    case 'remix-view':
                        newPageEl = document.createElement('remix-page');
                        break;
                    case 'advanced-view':
                        newPageEl = document.createElement('advanced-page');
                        break;
                    default:
                        console.error("Unknown page: ", pageName);
                        return;
                }


                newPageEl.setUserData?.(getUserDataForReadOnly("fhljQ592RJQjL0rD"));
                newPageEl.onWillBeDisplayed?.();
                // Cache and append the new page
                newPageEl.style.display = 'block';
                pageCache[pageName] = newPageEl;
                container.appendChild(newPageEl);

                pageCache[pageName].onDisplayed?.();
            }

            // Enable the sidebar menu once a real panel (not loading) appears
            if (pageName !== 'loading-view') {
                enableMenu();
                window.settlePageDisplay(beforeDisplay);
            }

            // Opening the video with edits pending: remind that it doesn't show them yet
            if (beforeDisplay.stale && (pageName === 'video-view' || pageName === 'remix-view')) {
                window.showStaleNotice();
            } else {
                dismissToast(STALE_NOTICE_ID);
            }
        }


        // Attach click listeners to your sidebar buttons.
        const menuButtons = document.querySelectorAll('.menu-btn');
        menuButtons.forEach((btn) => {
            btn.addEventListener('click', function () {
                if (this.hasAttribute('data-target')) {

                    loadPage(this.getAttribute('data-target'));
                }
            });
        });//

        // And for mobile dropdown changes:
        const mobileMenu = document.getElementById('mobileMenu');
        mobileMenu.addEventListener('change', function () {
            console.log(this.value + " - Selected");
            if (this.value == "resync-view") openConfirm('resync');
            else if (this.value == "regen-view") openConfirm('regenerate');
            else loadPage(this.value);
        });

        window.loadPage = loadPage;
        window.enableMenu = enableMenu;

        function loadFromQuery() {
            const urlParams = new URLSearchParams(window.location.search);
            const value = urlParams.get('page');
            const unavailable = window.userData.wordsNeedResync && ['word-timings', 'video', 'remix'].includes(value);

            switch (unavailable ? 'line-timings' : value) {
                case 'assignments':
                    loadPage('assignments-view');
                    break;
                case 'basics':
                    loadPage('basics-view');
                    break;
                case 'line-timings':
                    loadPage('line-timings-view');
                    break;
                case 'word-timings':
                    loadPage('timings-view');
                    break;
                case 'video':
                    loadPage('video-view');
                    break;
                case 'options':
                    loadPage('options-view');
                    break;
                case 'remix':
                    loadPage('remix-view');
                    break;
                case 'advanced':
                    loadPage('advanced-view');
                    break;
                default:
                    loadPage('basics-view');
            }
        }



        // Optionally, load a default page.
    </script>
